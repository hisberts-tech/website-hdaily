services:
  - type: web
    name: hdaily-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install && npx prisma db push --skip-generate && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Neon pooled connection string (used by the app at runtime)
      - key: DATABASE_URL
        sync: false
      # Neon direct (non-pooler) connection string (used by `prisma db push`)
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Comma-separated list of allowed browser origins (admin panel + storefront)
      - key: CORS_ORIGIN
        value: https://hdaily-site.vercel.app
      - key: MONCASH_NUMBER
        value: "+509 3913 4651"
      # Twilio SMS alerts — optional, leave blank to disable
      - key: ADMIN_PHONE
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
